
name: TravelPlanner CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Отримання коду
        uses: actions/checkout@v4

      - name: Встановлення .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Відновлення залежностей
        run: dotnet restore TravelPlanner.Tests/TravelPlanner.Tests.csproj

      - name: Збірка проєкту
        run: dotnet build TravelPlanner.Tests/TravelPlanner.Tests.csproj --no-restore

      - name: Запуск тестів
        run: dotnet test TravelPlanner.Tests/TravelPlanner.Tests.csproj --no-build --verbosity normal
